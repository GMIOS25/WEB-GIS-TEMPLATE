spring.application.name=gis

# Production database settings are supplied by SPRING_DATASOURCE_* variables.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# JDK 21 virtual threads are appropriate for this JDBC/file I/O-heavy service.
spring.threads.virtual.enabled=true
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:500}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:2000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/geo+json,application/xml,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.chain.enabled=true
spring.web.resources.chain.compressed=true
spring.web.resources.chain.cache=true

# Do not publish API documentation in production unless explicitly requested.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# Cache expensive PostGIS GeoJSON assembly and authentication lookups.
app.cache.geojson-ttl=${GEOJSON_CACHE_TTL:1h}
app.cache.user-details-ttl=${USER_DETAILS_CACHE_TTL:5m}

# JWT_SECRET is intentionally mandatory in production; there is no baked-in key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-name=${JWT_COOKIE_NAME:gis_token}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
app.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.seed.enabled=${SEED_DEFAULT_ACCOUNTS:false}
app.seed.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.viewer-username=${SEED_VIEWER_USERNAME:viewer}
app.seed.viewer-password=${SEED_VIEWER_PASSWORD:}
app.storage.local-path=${UPLOAD_PATH:./data/uploads}

features.ocop.enabled=${FEATURES_OCOP_ENABLED:false}
features.science.enabled=${FEATURES_SCIENCE_ENABLED:false}
features.agriculture.enabled=${FEATURES_AGRICULTURE_ENABLED:false}

# Health is public for orchestration; all other actuator endpoints require ADMIN.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
