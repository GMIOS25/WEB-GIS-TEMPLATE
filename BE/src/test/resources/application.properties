spring.application.name=gis

# 1. Flyway Test Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration/core,classpath:db/migration/science,classpath:db/migration/ocop,classpath:db/migration/agriculture

# 2. Feature Flags
features.science.enabled=true
features.ocop.enabled=true
features.agriculture.enabled=true

# 3. JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 4. JWT Configuration (>= 32 bytes / 256 bits)
app.jwt.secret=${JWT_SECRET:932326ec1935bc7c0cc163392c96d22e35ed8fb2b6d98fcb69ff4c0b001455e5}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-name=gis_token
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}

# 5. CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}

# 6. Server & Compression
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# 7. Seed
app.seed.enabled=false
